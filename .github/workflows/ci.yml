name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zig:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        run: brew install zig
      - name: Check formatting
        run: zig fmt --check build.zig src
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
